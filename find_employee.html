<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Profile - Handy Lanka</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #27ae60;
            --secondary: #f5b400;
            --danger: #ff4757;
            --bg: #f8fafc;
            --text-dark: #1e293b;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg); 
            margin: 0; 
            padding: 0;
            display: flex;
            justify-content: center;
            color: var(--text-dark);
        }

        .container { 
            width: 100%; 
            max-width: 480px; 
            min-height: 100vh;
            background: white; 
            padding: 24px; 
            box-sizing: border-box;
            box-shadow: 0 0 40px rgba(0,0,0,0.03);
        }

        /* Search Section */
        h3 { font-weight: 800; font-size: 24px; margin-bottom: 20px; color: var(--text-dark); text-align: center; }
        
        .search-box { position: relative; margin-bottom: 15px; }
        input { 
            width: 100%; 
            padding: 16px 16px 16px 45px; 
            border: 1.5px solid #e2e8f0; 
            border-radius: 16px; 
            outline: none; 
            box-sizing: border-box;
            font-size: 15px;
            transition: 0.3s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(39, 174, 96, 0.1); }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #94a3b8; }

        button#findBtn { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 16px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: 700; 
            font-size: 16px; 
            box-shadow: 0 10px 20px rgba(39, 174, 96, 0.2);
            transition: 0.3s;
        }
        button#findBtn:active { transform: scale(0.98); }

        .back-btn { 
            display: block; 
            text-align: center; 
            margin-top: 15px; 
            color: #64748b; 
            text-decoration: none; 
            font-size: 14px; 
            font-weight: 600;
        }

        /* Profile Section */
        #profileCard { display: none; margin-top: 30px; animation: slideUp 0.5s ease; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-header { text-align: center; margin-bottom: 25px; }
        .profile-img { 
            width: 110px; height: 110px; 
            border-radius: 35px; 
            object-fit: cover; 
            border: 4px solid white; 
            box-shadow: var(--card-shadow);
            margin-bottom: 15px;
        }
        .emp-name { font-size: 24px; font-weight: 800; margin: 0; color: var(--text-dark); }
        
        .info-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            background: #f1f5f9; 
            padding: 15px; 
            border-radius: 20px;
            margin-bottom: 25px;
        }
        .info-grid p { margin: 0; font-size: 13px; color: #64748b; }
        .info-grid b { display: block; color: var(--text-dark); font-size: 14px; margin-bottom: 2px; }

        .order-title { 
            font-size: 18px; 
            font-weight: 800; 
            margin: 25px 0 15px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .order-title i { color: var(--secondary); }

        /* Busy Tags */
        .busy-tag { 
            background: #fff1f2; 
            border: 1px solid #ffe4e6; 
            color: #be123c; 
            padding: 10px 15px; 
            border-radius: 12px; 
            font-size: 12px; 
            font-weight: 700;
            text-align: center;
        }
        .busy-tag span { display: block; font-size: 10px; opacity: 0.8; font-weight: 500; }

        /* Appointments */
        .appointment-item { 
            background: white; 
            padding: 18px; 
            border-radius: 20px; 
            margin-bottom: 15px; 
            border: 1px solid #f1f5f9; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            position: relative;
            transition: 0.3s;
        }
        .appointment-item:hover { border-color: var(--secondary); }
        .status-cancelled { background-color: #fffafb; border-left: 4px solid var(--danger); }
        
        .badge { 
            font-size: 10px; 
            padding: 4px 10px; 
            border-radius: 8px; 
            color: white; 
            font-weight: 700;
            position: absolute; 
            top: 18px; 
            right: 18px; 
        }

        .order-info { font-size: 14px; margin: 8px 0; color: #475569; display: flex; align-items: center; gap: 8px; }
        .order-info i { width: 18px; color: #94a3b8; }

        .cancel-order-btn { 
            background-color: #fff1f2; 
            color: var(--danger); 
            border: 1px solid #ffe4e6; 
            padding: 10px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 13px; 
            font-weight: 700;
            width: 100%; 
            margin-top: 12px;
            transition: 0.3s;
        }
        .cancel-order-btn:hover { background: var(--danger); color: white; }

        .error { color: var(--danger); text-align: center; font-weight: 700; margin-top: 20px; display: none; }
        #appointments-list { padding-bottom: 50px; }
    </style>
</head>
<body>

<div class="container">
    <h3><i class="fas fa-user-circle" style="color: var(--primary);"></i> Profile Center</h3>
    
    <div class="search-box">
        <i class="fas fa-envelope search-icon"></i>
        <input type="email" id="emailInput" placeholder="Enter employee email">
    </div>
    
    <button id="findBtn" onclick="getProfile()">
        <i class="fas fa-search"></i> View Professional Profile
    </button>
    
    <a href="owner.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>

    <p id="err" class="error"><i class="fas fa-exclamation-circle"></i> Account not found!</p>

    <div id="profileCard">
        <div class="profile-header">
            <img src="" id="pImg" class="profile-img">
            <h1 id="pName" class="emp-name"></h1>
            <p id="pService" style="color:var(--primary); font-weight:800; margin:8px 0; letter-spacing: 1px;"></p>
        </div>

        <div class="info-grid">
            <p><b><i class="fas fa-phone"></i> Phone</b> <span id="pPhone"></span></p>
            <p><b><i class="fas fa-clock"></i> Experience</b> <span id="pExp"></span></p>
            <p><b><i class="fas fa-bolt"></i> Skill</b> <span id="pSkill"></span>%</p>
        </div>

        <div id="availability-card" style="display:none; margin-top: 20px;">
            <div class="order-title"><i class="fas fa-calendar-times"></i> Busy Days</div>
            <div id="busy-dates-list" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;"></div>
        </div>

        <div class="order-title"><i class="fas fa-briefcase"></i> Job Appointments</div>
        <div id="appointments-list">
            <p style="text-align: center; color: #94a3b8; font-size: 13px;">No bookings found.</p>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBmVI2C4G9S4THlS2Tu3JpVo1LpDAMBpfM",
        authDomain: "handylanka-6f7b3.firebaseapp.com",
        databaseURL: "https://handylanka-6f7b3-default-rtdb.firebaseio.com",
        projectId: "handylanka-6f7b3",
        storageBucket: "handylanka-6f7b3.firebasestorage.app",
        messagingSenderId: "932726552349",
        appId: "1:932726552349:web:e7a51b17fd381b168d93f4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function getProfile() {
        const email = document.getElementById('emailInput').value.trim().toLowerCase();
        if(!email) return alert("Please enter an email!");

        db.ref('employees').orderByChild('email').equalTo(email).once('value', snapshot => {
            if (snapshot.exists()) {
                const val = snapshot.val();
                const key = Object.keys(val)[0];
                const emp = val[key];
                const empName = emp.name;

                document.getElementById('pName').innerText = empName;
                document.getElementById('pService').innerText = emp.service.toUpperCase();
                document.getElementById('pPhone').innerText = emp.phone;
                document.getElementById('pExp').innerText = emp.exp;
                document.getElementById('pSkill').innerText = emp.skill;
                document.getElementById('pImg').src = (emp.photo === "no-image" || !emp.photo) 
                    ? "https://cdn-icons-png.flaticon.com/512/3135/3135715.png" 
                    : emp.photo;

                document.getElementById('profileCard').style.display = 'block';
                document.getElementById('err').style.display = 'none';

                sendToGoogleSheet(email, "Profile Accessed", "Login Success");

                fetchOrders(empName);
                fetchAvailability(empName);
            } else {
                document.getElementById('profileCard').style.display = 'none';
                document.getElementById('err').style.display = 'block';
            }
        });
    }

    function fetchAvailability(name) {
        const container = document.getElementById('busy-dates-list');
        const section = document.getElementById('availability-card');
        
        db.ref('availability/' + name.replace(/\s/g, '_')).on('value', snapshot => {
            container.innerHTML = "";
            if (snapshot.exists()) {
                section.style.display = "block";
                snapshot.forEach(child => {
                    const data = child.val();
                    container.innerHTML += `
                        <div class="busy-tag">
                            <i class="far fa-calendar-alt"></i> ${data.date}
                            <span>${data.timeLabel || 'Full Day Off'}</span>
                        </div>
                    `;
                });
            } else { section.style.display = "none"; }
        });
    }

    function fetchOrders(name) {
        const listContainer = document.getElementById('appointments-list');
        db.ref('bookings').orderByChild('Professional_Name').equalTo(name.trim()).on('value', snapshot => {
            listContainer.innerHTML = "";
            if (snapshot.exists()) {
                snapshot.forEach(child => {
                    const order = child.val();
                    const orderId = child.key;
                    const status = (order.Status || "").toLowerCase();
                    const isCancelled = status === "cancelled";

                    const html = `
                        <div class="appointment-item ${isCancelled ? 'status-cancelled' : ''}">
                            ${isCancelled ? '<span class="badge" style="background:#e74c3c">CANCELLED</span>' : '<span class="badge" style="background:#f5b400">PENDING</span>'}
                            <div style="font-weight:800; color:#1e293b; font-size:16px; margin-bottom:10px;">
                                <i class="fas fa-user-alt" style="color:#94a3b8; font-size:14px;"></i> ${order.Customer_Name}
                            </div>
                            <div class="order-info"><i class="fas fa-tools"></i> <b>Job:</b> ${order.Work_Description || 'Not Specified'}</div>
                            <div class="order-info"><i class="fas fa-calendar-day"></i> ${order.Date} | <i class="fas fa-clock"></i> ${order.Time}</div>
                            ${isCancelled ? `<div class="order-info" style="color:#e74c3c; font-size:12px; margin-top:10px; background:#fff1f2; padding:8px; border-radius:8px;">
                                <b>Reason:</b> ${order.Cancellation_Reason || 'N/A'}</div>` : 
                            `<button class="cancel-order-btn" onclick="cancelOrder('${orderId}', '${order.Customer_Name}')">
                                <i class="fas fa-times-circle"></i> Cancel Order
                            </button>`}
                        </div>
                    `;
                    listContainer.innerHTML += html;
                });
            } else {
                listContainer.innerHTML = `<p style="text-align: center; color: #94a3b8; font-size: 13px; padding:20px;">No appointments found.</p>`;
            }
        });
    }

    function cancelOrder(orderId, customerName) {
        const reason = prompt("Please enter the reason for cancellation:");
        if (!reason || reason.trim() === "") return;
        const employeeEmail = document.getElementById('emailInput').value.trim().toLowerCase();

        db.ref('bookings/' + orderId).once('value', snapshot => {
            if (snapshot.exists()) {
                const orderData = snapshot.val();
                db.ref('bookings/' + orderId).update({
                    Status: "Cancelled",
                    Cancellation_Reason: reason
                }).then(() => {
                    sendToGoogleSheet(employeeEmail, orderData.Customer_Name, orderData.Customer_Phone, reason);
                    alert("Order Cancelled Successfully!");
                });
            }
        });
    }

    function sendToGoogleSheet(email, customer, phone, reason) {
        const scriptURL = "https://script.google.com/macros/s/AKfycbwK_aWFnANascCbA698bNKtlESBMSosyQKIddg0LcvLTzsha56-kgQJi4Jm1JH3PEBEMQ/exec";
        const formData = new URLSearchParams();
        formData.append("mode", "cancel"); 
        formData.append("reference", email);
        formData.append("customer", customer);
        formData.append("phone", phone);
        formData.append("reason", reason);

        fetch(scriptURL, { method: 'POST', body: formData, headers: { 'Content-Type': 'application/x-www-form-urlencoded' }})
        .then(response => console.log('Sheet Update Request Sent'))
        .catch(error => console.error('Sheet Update Error!', error.message));
    }
</script>
</body>
</html>
