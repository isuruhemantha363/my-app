<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Handy Lanka | Mobile App Interface</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --primary: #f5b400;
      --secondary: #eb9f08;
      --dark: #111827;
      --card-bg: #ffffff;
      --shadow: 0 4px 15px rgba(0,0,0,0.08);
      --border: #e5e7eb;
    }

    body { 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
      color: var(--dark);
      background-color: #f8fafc;
      min-height: 100vh;
    }

    /* Header for Mobile */
    header { 
      background: white; 
      padding: 12px 15px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      box-shadow: 0 1px 10px rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .n_logo { width: 90px; height: auto; cursor: pointer; }
    .header-brand { font-weight: 900; font-size: 14px; letter-spacing: 0.5px; }

    /* Layout Containers */
    .main-container { 
      width: 100%;
      max-width: 600px; /* Limits width on tablets but stays full on phone */
      margin: 0 auto; 
      display: flex;
      flex-direction: column; /* Stack vertically for mobile */
      gap: 20px; 
      padding: 15px; 
      box-sizing: border-box;
    }

    /* Progress Bar optimization for small screens */
    .progress-container {
      margin: 10px 0 35px;
      display: flex;
      justify-content: space-between;
      position: relative;
    }
    .progress-container::before {
      content: "";
      background-color: #e5e7eb;
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      height: 3px;
      width: 100%;
      z-index: 1;
    }
    .step {
      background-color: #fff;
      color: #9ca3af;
      border-radius: 50%;
      height: 30px;
      width: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #e5e7eb;
      z-index: 2;
      font-weight: bold;
      font-size: 12px;
      position: relative;
    }
    .step.active { border-color: var(--primary); color: #fff; background: var(--primary); }
    .step-label {
      position: absolute;
      top: 35px;
      font-size: 9px;
      white-space: nowrap;
      font-weight: 700;
      color: #6b7280;
    }

    .booking-card, .profile-card { 
      background: var(--card-bg); 
      border-radius: 20px; 
      padding: 20px; 
      box-shadow: var(--shadow); 
      border: 1px solid #f1f5f9;
    }

    /* Employee List optimization */
    .employee-list { 
      display: flex; 
      flex-direction: column; /* Vertical list on mobile */
      gap: 15px; 
      margin-top: 15px; 
    }
    .emp-card { 
      border: 1px solid #eee; 
      border-radius: 18px; 
      padding: 15px; 
      background: #fff; 
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .emp-card img { 
      width: 80px; 
      height: 80px; 
      border-radius: 50%; 
      object-fit: cover; 
      margin-bottom: 10px; 
      border: 2px solid var(--primary);
    }

    .feedback-btn { 
      background: #fffbeb; 
      color: #b45309; 
      border: 1px solid #fef3c7; 
      padding: 10px; 
      border-radius: 10px; 
      font-size: 11px; 
      font-weight: 700; 
      width: 100%; 
      margin-top: 10px;
    }
    
    /* Form Elements for touch */
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: #4b5563; }
    input, select, textarea { 
      width: 100%; 
      padding: 12px; 
      border: 1.5px solid var(--border); 
      border-radius: 10px; 
      font-size: 14px; 
      box-sizing: border-box; 
    }
    
    .readonly-field { background: #f9fafb; font-weight: 600; color: #92400e; border-style: dashed; }
    
    .payment-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pay-card { 
      display: flex; 
      gap: 5px; 
      align-items: center; 
      justify-content: center; 
      padding: 12px; 
      border: 2px solid #e5e7eb; 
      border-radius: 10px; 
      font-size: 14px;
      font-weight: 700; 
    }
    .pay-option input:checked + .pay-card { border-color: var(--primary); background: #fffbeb; }
    
    .submit-btn { 
      width: 100%; 
      background: var(--primary); 
      border: none; 
      padding: 16px; 
      border-radius: 15px; 
      font-size: 17px; 
      font-weight: 800; 
      color: #451a03;
      margin-top: 10px;
    }

    /* Modal for Mobile */
    .modal { 
      display: none; 
      position: fixed; 
      z-index: 2000; 
      inset: 0; 
      background: rgba(0,0,0,0.6); 
      padding: 10px;
    }
    .modal-content { 
      background: #fff; 
      margin: 10vh auto; 
      width: 100%; 
      max-width: 400px; 
      border-radius: 20px; 
      overflow: hidden; 
    }
    .modal-header { padding: 15px; border-bottom: 1px solid #eee; text-align: center; }
    .feedback-list { padding: 15px; max-height: 350px; overflow-y: auto; }
    .fb-card { background: #f9fafb; padding: 12px; border-radius: 12px; margin-bottom: 10px; font-size: 13px; }

    .loc-btn { 
      background: #f0f9ff; color: #0369a1; border: 1px solid #bae6fd; 
      padding: 10px; border-radius: 10px; font-size: 11px; 
      font-weight: bold; margin-top: 8px; width: 100%; 
    }

    #busy-display { margin-top: 15px; padding: 12px; background: #fff5f5; border: 1px dashed #feb2b2; border-radius: 15px; }
    .busy-item { display: inline-block; background: #f56565; color: white; padding: 4px 8px; border-radius: 8px; font-size: 10px; margin: 2px; }

    /* Utility */
    .mobile-hide { display: none; }
  </style>
</head>
<body>

<header>
  <img src="n logo.png" class="n_logo" alt="Logo" onclick="window.location.href='page1.html'">
  <div class="header-brand">HANDY LANKA</div>
</header>

<div class="main-container">
  
  <div class="booking-card" style="padding: 15px 10px;">
    <div class="progress-container">
      <div class="step active" id="step1">1 <span class="step-label">Category</span></div>
      <div class="step" id="step2">2 <span class="step-label">Expert</span></div>
      <div class="step" id="step3">3 <span class="step-label">Details</span></div>
      <div class="step" id="step4">4 <span class="step-label">Book</span></div>
    </div>
  </div>

  <div class="profile-card">
    <h3 id="list-title" style="text-align: center; margin: 0 0 15px; font-size: 18px;">Available Experts</h3>
    <div class="employee-list" id="employee-container">
      <p style="text-align: center; color: #9ca3af; padding: 20px 0; font-size: 14px;">Select a category to view professionals.</p>
    </div>

    <div id="selected-profile-display" style="display:none;">
      <button type="button" onclick="resetSelection()" style="color:var(--secondary); background:#fff9e6; border:1px solid #fef3c7; padding:10px; border-radius:10px; margin-bottom:15px; font-weight:bold; font-size: 12px; width: 100%;">
        ← Choose Another Expert
      </button>
      <div id="active-worker-info"></div>

      <div id="busy-display">
        <div style="font-weight: 800; font-size: 12px; color: #c53030; margin-bottom: 5px;">📅 Busy Schedule:</div>
        <div id="busy-list"></div>
      </div>
    </div>
  </div>

  <div class="booking-card">
    <h3 style="margin-top:0; text-align:center; color: #b45309; font-size: 22px;">Complete Booking</h3>
    
    <form id="mainBookingForm">
      <input type="hidden" name="Submission_Time" id="submission_timestamp">
      <input type="hidden" name="Employee_ID" id="hide_emp_id">
      <input type="hidden" name="Customer_Coordinates" id="customer_coords">
      <input type="hidden" name="Employee_Email" id="hide_emp_email">
      <input type="hidden" name="Status" value="Active">
      <input type="hidden" name="emp_phone" id="hide_emp_phone">

      <div class="form-group">
        <label>Service Category</label>
        <select name="Main_Category" id="main_category_select" onchange="updateStep(1); autoFillServiceType(); filterEmployees();" required>
          <option value="">-- Select --</option>
          <option value="house_cleaning_painting">House Cleaning & Painting</option>
          <option value="electrical_repairs">Electrical Repairs</option>
          <option value="gardening_services">Gardening</option>
          <option value="plumbing_services">Plumbing</option>
          <option value="handyman_services">Handyman</option>
          <option value="moving_assistance">Moving Service</option>
        </select>
      </div>

      <div class="form-group">
        <label>Service Type</label>
        <input type="text" name="Service_Type" id="service_type_input" class="readonly-field" readonly required>
      </div>

      <div class="form-group">
        <label>Expert</label>
        <input type="text" name="Professional_Name" id="form_worker_name" class="readonly-field" placeholder="Select an expert" readonly required>
      </div>

      <div class="form-group">
        <label>Your Name</label>
        <input type="text" name="Customer_Name" oninput="updateStep(3)" required>
      </div>

      <div class="form-group">
        <label>Mobile Number</label>
        <input type="tel" name="Customer_Phone" maxlength="10" required>
      </div>

      <div class="form-group">
        <label>Address</label>
        <input type="text" name="Customer_Address" id="customer_address" required>
        <button type="button" class="loc-btn" onclick="getLocation()">📍 Auto-Detect My Location</button>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="Customer_Email" required>
      </div>

      <div class="form-group">
        <label>Work Description</label>
        <textarea name="Work_Description" rows="3" required></textarea>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
        <div><label>Date</label><input type="date" name="Date" id="booking_date" required></div>
        <div><label>Time</label><input type="time" name="Time" id="booking_time" required></div>
      </div>

      <div class="form-group">
        <label>Payment Method</label>
        <div class="payment-grid">
          <label class="pay-option">
            <input type="radio" name="Payment_Method" value="Cash" checked>
            <div class="pay-card">💵 Cash</div>
          </label>
          <label class="pay-option">
            <input type="radio" name="Payment_Method" value="Card">
            <div class="pay-card">💳 Card</div>
          </label>
        </div>
      </div>

      <button type="submit" class="submit-btn">Book Appointment</button>
    </form>
  </div>
</div>

<div id="feedbackModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalWorkerName" style="margin:0; font-size: 18px;">Reviews</h3>
    </div>
    <div class="feedback-list" id="feedbackContainer"></div>
    <div style="padding: 15px;">
      <button onclick="closeFeedback()" style="background: var(--dark); color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: bold;">Close</button>
    </div>
  </div>
</div>

<script>
  // ඔබගේ මුල් Logic සහ Firebase Config ඒ ආකාරයෙන්ම පවතී
  const firebaseConfig = {
    apiKey: "AIzaSyBmVI2C4G9S4THlS2Tu3JpVo1LpDAMBpfM",
    authDomain: "handylanka-6f7b3.firebaseapp.com",
    databaseURL: "https://handylanka-6f7b3-default-rtdb.firebaseio.com",
    projectId: "handylanka-6f7b3",
    storageBucket: "handylanka-6f7b3.firebasestorage.app",
    messagingSenderId: "932726552349",
    appId: "1:932726552349:web:e7a51b17fd381b168d93f4"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  let allEmployees = [];

  function getLocation() {
    const addrInput = document.getElementById('customer_address');
    const coordInput = document.getElementById('customer_coords');
    if (navigator.geolocation) {
      addrInput.placeholder = "Locating...";
      navigator.geolocation.getCurrentPosition((pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          coordInput.value = `Lat: ${lat}, Lon: ${lon}`;
          addrInput.value = `Location Pin Set`;
          alert("Location detected!");
        }, () => alert("Please enable GPS.")
      );
    }
  }

  function updateStep(step) {
    for(let i=1; i<=4; i++) {
        const stepEl = document.getElementById('step' + i);
        if(stepEl) {
          if(i <= step) stepEl.classList.add('active');
          else stepEl.classList.remove('active');
        }
    }
  }

  function autoFillServiceType() {
    const category = document.getElementById('main_category_select').value;
    const typeInput = document.getElementById('service_type_input');
    const serviceMap = {
      'house_cleaning_painting': 'Cleaning & Painting Care',
      'electrical_repairs': 'Technical Support',
      'gardening_services': 'Outdoor Maintenance',
      'plumbing_services': 'Hydraulic Works',
      'handyman_services': 'General Repairs',
      'moving_assistance': 'Logistics & Moving'
    };
    typeInput.value = serviceMap[category] || "";
  }

  function fetchInitialData() {
    database.ref('employees').on('value', (snapshot) => {
      const data = snapshot.val();
      allEmployees = [];
      for (let id in data) { allEmployees.push({id, ...data[id]}); }
      filterEmployees();
    });
  }

  function filterEmployees() {
    const selectedVal = document.getElementById('main_category_select').value;
    const container = document.getElementById('employee-container');
    resetSelection();
    if (!selectedVal) { 
      container.innerHTML = '<p style="text-align: center; color: #9ca3af; padding: 20px 0; font-size: 14px;">Select a category to view experts.</p>'; 
      return; 
    }
    const filtered = allEmployees.filter(emp => {
      const dbService = (emp.service || "").toLowerCase().replace(/_/g, '');
      const searchVal = selectedVal.toLowerCase().replace(/_/g, '').replace('services', '').replace('repairs', '').replace('assistance', '');
      return dbService.includes(searchVal);
    });
    container.innerHTML = filtered.length ? '' : '<p style="text-align: center;">No professionals found.</p>';
    filtered.forEach(emp => {
      container.innerHTML += `
        <div class="emp-card">
          <div onclick="selectWorker('${emp.id}')" style="text-align:center; width:100%;">
            <img src="${emp.photo === 'no-image' ? 'https://cdn-icons-png.flaticon.com/512/149/149071.png' : emp.photo}">
            <div style="font-weight:800; font-size: 16px;">${emp.name}</div>
            <div style="font-size:11px; color:#b45309; font-weight:700; margin-bottom: 8px;">${emp.sub_service || 'Expert'}</div>
            <div style="text-align: left; font-size: 12px; border-top: 1px solid #eee; padding-top: 10px; color: #4b5563;">
              <div style="margin-bottom:4px;"><b>📍 Address:</b> ${emp.address || 'N/A'}</div>
              <div><b>💰 Rate:</b> Rs. ${emp.hourly_rate || 'Negotiable'}</div>
            </div>
          </div>
          <button type="button" class="feedback-btn" onclick="showFeedbacks('${emp.name}')">⭐ VIEW REVIEWS</button>
        </div>`;
    });
  }

  function selectWorker(id) {
    const worker = allEmployees.find(e => e.id === id);
    document.getElementById('employee-container').style.display = 'none';
    document.getElementById('list-title').style.display = 'none';
    document.getElementById('selected-profile-display').style.display = 'block';
    document.getElementById('hide_emp_phone').value = worker.phone || "";
    
    document.getElementById('active-worker-info').innerHTML = `
      <div style="text-align: center; background: #fffbeb; padding: 20px; border-radius: 15px;">
        <img src="${worker.photo === 'no-image' ? 'https://cdn-icons-png.flaticon.com/512/149/149071.png' : worker.photo}" style="width:80px; height:80px; border-radius:50%; border:3px solid #f5b400; object-fit: cover;">
        <h3 style="margin: 10px 0 5px;">${worker.name}</h3>
        <span style="color: #b45309; font-weight: 800; font-size: 12px;">${worker.sub_service || 'Professional'}</span>
      </div>
      <div style="padding: 15px 5px; font-size: 13px; color: #374151;">
          <div style="margin-bottom:8px;"><b>📍 Address:</b><br>${worker.address || 'N/A'}</div>
          <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
            <span><b>🏆 Exp:</b> ${worker.exp || 'N/A'}</span>
            <span><b>💰 Rate:</b> Rs. ${worker.hourly_rate}</span>
          </div>
          <div><b>⚡ Skill Level:</b> ${worker.skill || 'Verified'}</div>
      </div>`;
      
    document.getElementById('form_worker_name').value = worker.name;
    document.getElementById('hide_emp_id').value = id;
    document.getElementById('hide_emp_email').value = worker.email || ""; 
    checkAvailabilityDisplay(worker.name);
    updateStep(2);
  }

  function resetSelection() {
    document.getElementById('employee-container').style.display = 'flex';
    document.getElementById('list-title').style.display = 'block';
    document.getElementById('selected-profile-display').style.display = 'none';
    document.getElementById('form_worker_name').value = "";
    document.getElementById('busy-display').style.display = "none";
  }

  function checkAvailabilityDisplay(workerName) {
    const list = document.getElementById('busy-list');
    const display = document.getElementById('busy-display');
    database.ref('availability/' + workerName.replace(/\s/g, '_')).on('value', snapshot => {
        list.innerHTML = "";
        if (snapshot.exists()) {
            display.style.display = "block";
            snapshot.forEach(child => {
                const data = child.val();
                list.innerHTML += `<span class="busy-item">${data.date}</span>`;
            });
        } else { display.style.display = "none"; }
    });
  }

  document.getElementById('mainBookingForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const submitBtn = this.querySelector('.submit-btn');
    const selectedDate = document.getElementById('booking_date').value;
    const selectedTime = document.getElementById('booking_time').value;
    const workerName = document.getElementById('form_worker_name').value;

    if (!workerName) return alert("Select an expert first!");

    submitBtn.innerText = "Processing...";
    submitBtn.disabled = true;

    // Check Availability Logic (Same as original)
    const availabilitySnap = await database.ref('availability/' + workerName.replace(/\s/g, '_')).once('value');
    let isBusy = false;
    availabilitySnap.forEach(child => {
        if (child.val().date === selectedDate) isBusy = true;
    });

    if (isBusy) {
        alert("Expert is busy on this date.");
        submitBtn.disabled = false;
        return;
    }

    const now = new Date();
    document.getElementById('submission_timestamp').value = now.toLocaleString();
    const formData = new FormData(this);
    const bookingData = {};
    formData.forEach((v, k) => { bookingData[k] = v; });

    database.ref('bookings').push().set(bookingData).then(() => {
      window.location.href = "booking-success.html";
    }).catch(err => {
      alert("Error saving booking.");
      submitBtn.disabled = false;
    });
  });

  function showFeedbacks(employeeName) {
    document.getElementById('modalWorkerName').innerText = employeeName;
    document.getElementById('feedbackModal').style.display = 'block';
    database.ref('feedbacks').orderByChild('employee').equalTo(employeeName).once('value', (snapshot) => {
      let html = "";
      if (snapshot.exists()) {
        snapshot.forEach(child => {
          const fb = child.val();
          html += `<div class="fb-card"><b>${fb.customer}</b><br>${fb.comments}</div>`;
        });
        document.getElementById('feedbackContainer').innerHTML = html;
      } else { document.getElementById('feedbackContainer').innerHTML = "No reviews."; }
    });
  }

  function closeFeedback() { document.getElementById('feedbackModal').style.display = 'none'; }
  
  window.onload = fetchInitialData;
</script>
</body>
</html>
